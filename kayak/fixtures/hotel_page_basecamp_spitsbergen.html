-Fi?","answer":"Yes, Basecamp Spitsbergen Hotel offers free Wi-Fi."},{"questionId":"hotelFreeParkingFaq","question":"Does Basecamp Spitsbergen Hotel offer free parking?","answer":"Yes, Basecamp Spitsbergen Hotel offers free parking."},{"questionId":"hotelDistanceToAirportFaq","question":"How far is Basecamp Spitsbergen Hotel from the airport?","answer":"Basecamp Spitsbergen Hotel is 3.2 miles from Longyearbyen Svalbard."},{"questionId":"greatDealsFaq","question":"How does KAYAK find such great Basecamp Spitsbergen Hotel hotel deals?","answer":"KAYAK scours the web for all room deals available at Basecamp Spitsbergen Hotel in Longyearbyen and lets you compare them to find the best rate for your stay. Many different travel sites will offer discounts or deals at different times for rooms at Basecamp Spitsbergen Hotel and KAYAK will provide you with prices from a huge range of travel sites. That means that you can always find a great deal for Basecamp Spitsbergen Hotel."}],"tips":["If you’re after a cheap room at Basecamp Spitsbergen Hotel, then you should consider staying during the low season. The cheapest deals can generally be found in October and January.","Prices can also vary depending on which day of the week you stay. For the best room deals at Basecamp Spitsbergen Hotel, plan to stay on a Thursday or Saturday. The most expensive day is usually Friday.","The cheapest price a room at Basecamp Spitsbergen Hotel was booked for on KAYAK in the last 2 weeks was $322, while the most expensive was $322.","How long should you stay at Basecamp Spitsbergen Hotel? KAYAK users usually book their rooms here for 2 days."],"faqsAi":[{"header":"What can I expect from the breakfast at Basecamp Hotel?","content":"The breakfast at Basecamp Hotel is known for its variety and quality, with freshly made egg dishes, homemade items, and a superb spread of options."},{"header":"Is the hotel suitable for families with children?","content":"While the hotel offers a cozy and unique atmosphere, some guests have mentioned concerns about the bunk beds not being suitable for children due to safety reasons."},{"header":"What are the unique design features of Basecamp Hotel?","content":"Basecamp Hotel is praised for its cozy and rustic 'Arctic explorer' style, with all-wood interiors, giving a warm and inviting feel after being outdoors in the cold, stark arctic town."},{"header":"How is the staff at Basecamp Hotel?","content":"Guests have consistently highlighted the exceptional friendliness and helpfulness of the staff, who go above and beyond to ensure a fantastic stay."},{"header":"What are the parking options at Basecamp Hotel?","content":"Basecamp Hotel offers free parking for guests, providing convenience for those arriving by car."}],"tipsAi":[{"header":"Opt for a Room with a View","content":"Several guests mentioned that the views from the rooms were spectacular. Opting for a room with a balcony facing the fountain comes highly recommended."},{"header":"Consider Room Location","content":"Some guests found that rooms located in the main hallway felt less cozy. If you prefer a quieter atmosphere, consider requesting a room away from the main hallway."},{"header":"Plan for Noise","content":"Guests noted that the hotel can get noisy, especially in the evenings, with children running and playing in the hallways. If you're a light sleeper, it may be helpful to bring earplugs."},{"header":"Take Advantage of the Breakfast","content":"Many guests praised the breakfast, particularly the freshly made egg dishes. Make sure to indulge in the cooked-to-order specialties and homemade items."},{"header":"Be Mindful of Room Features","content":"Some guests found the bunk beds to be unsuitable, especially for children or individuals who have been drinking. If this is a concern, it may be best to inquire about bed options when booking."},{"header":"Check Room Amenities","content":"While the hotel exudes a cozy and rustic atmosphere, some guests noted that certain rooms had a faint smell of cigarette smoke and worn bedsheets. It's advisable to inquire about these aspects when booking."},{"header":"Embrace the Unique Ambiance","content":"Guests appreciated the hotel's unique trapper cabin ambiance and cozy, warm feeling. Take the time to appreciate the rustic and simple yet beautiful design of the hotel."},{"header":"Utilize the Tour Desk","content":"The hotel offers a tour desk, and the staff can assist with activity planning and transportation arrangements. Take advantage of this service to make the most of your stay in Longyearbyen."},{"header":"Be Prepared for Limited Room Space","content":"Some guests found the rooms to be basic and not particularly large. If you prioritize spacious accommodations, it's advisable to manage expectations regarding room size."},{"header":"Enjoy the Central Location","content":"The hotel's central location provides easy access to shops, groceries, and restaurants. Take advantage of the convenient location to explore the surrounding area."}],"policies":[{"type":"other","title":"Check-in/Check-out","dataText":"Check in anytime after 2:00 PM, check out anytime before 11:00 AM","description":null,"tooltipInfo":null,"additionalInfo":null,"provider":null,"airlineImageUrl":null,"dealInfo":null,"airlineCode":null},{"type":"hotelCancellation","title":"Cancellation/prepayment","dataText":"Cancellation/prepayment policies vary by room type and provider.","description":null,"tooltipInfo":null,"additionalInfo":null,"provider":null,"airlineImageUrl":null,"dealInfo":null,"airlineCode":null}],"amenitiesData":{"topAmenities":[{"code":"restaurant","localizedName":"Restaurant","icon":"restaurant"},{"code":"bar","localizedName":"Bar/Lounge","icon":"bar"},{"code":"wififree","localizedName":"Free Wi-Fi","icon":"wifi"},{"code":"parkingfree","localizedName":"Free parking","icon":"parking"},{"code":"wifi_available_in_all_areas","localizedName":"Wi-Fi available in all areas","icon":"wifi"},{"code":"free_toiletries","lo
